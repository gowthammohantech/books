name: $(Date:yyyyMMdd).$(Rev:r)

# The web image builds from the REPOSITORY ROOT (npm workspaces keep a single
# lockfile there), so the triggers cover the shared workspace files too — a
# change to packages/* or the root manifests changes the bundle.
trigger:
  branches:
    include:
      - dev
  paths:
    include:
      - apps/web/**
      - packages/**
      - scripts/**
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - turbo.json
      - .npmrc
      - .dockerignore
      - azure-pipelines-web-ui.yml

pr:
  branches:
    include:
      - dev
  paths:
    include:
      - apps/web/**
      - packages/**
      - scripts/**
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - turbo.json
      - .npmrc
      - .dockerignore
      - azure-pipelines-web-ui.yml

variables:
  # Azure App Service service connection
  azureServiceConnection: 'stg-books-smart-service-connection'

  # Azure Container Registry service connection
  acrServiceConnection: 'stg-books-acr-service-connection'

  ACR_LOGIN_SERVER: 'ebselixiracr.azurecr.io'
  ACR_REPOSITORY: 'elixirbooks-kanakku-ui'

  webAppName: 'stg-elixirbooks-kan-app-ui'

  imageTag: 'stage-kanakku-ui-$(Build.BuildNumber)'

  # Baked into the bundle at build time. apps/web/Dockerfile deliberately has
  # NO default for this (an empty value means same-origin, which only works
  # behind the compose nginx /api proxy), so staging must pass the API host
  # explicitly here.
  viteApiBaseUrl: 'https://elixirbooks-kanaku-api-cagqg6fng5dtazbc.southeastasia-01.azurewebsites.net'
  viteDemoMode: 'false'

pool:
  vmImage: 'ubuntu-latest'

stages:

# ============================================================
# BUILD AND PUSH IMAGE TO ACR
# ============================================================
- stage: BuildAndPush
  displayName: Build and Push Web UI Docker Image

  jobs:
  - job: BuildPushImage
    displayName: Build and Push Kanakku Web UI Image

    steps:
    - checkout: self

    # build and push are separate steps because Docker@2 ignores `arguments`
    # for the buildAndPush command, and the VITE_* build args must reach the
    # build.
    - task: Docker@2
      displayName: 'Build Kanakku Web UI image'
      inputs:
        command: build
        containerRegistry: '$(acrServiceConnection)'
        repository: '$(ACR_REPOSITORY)'
        dockerfile: 'apps/web/Dockerfile'
        # Repo root: the Dockerfile copies the root lockfile and every workspace
        # manifest so `npm ci` is reproducible.
        buildContext: '$(Build.SourcesDirectory)'
        arguments: >-
          --build-arg VITE_API_BASE_URL=$(viteApiBaseUrl)
          --build-arg VITE_DEMO_MODE=$(viteDemoMode)
        tags: |
          $(imageTag)

    - task: Docker@2
      displayName: 'Push Kanakku Web UI image'
      inputs:
        command: push
        containerRegistry: '$(acrServiceConnection)'
        repository: '$(ACR_REPOSITORY)'
        tags: |
          $(imageTag)


# ============================================================
# DEPLOY TO STAGING
# ============================================================
- stage: DeployToStaging
  displayName: Deploy Web UI to Staging

  dependsOn: BuildAndPush

  condition: succeeded()

  jobs:
  - deployment: Deploy_kanakku_ui_staging
    displayName: Deploy Kanakku Web UI to Staging

    environment: 'kanakku-ui-staging'

    strategy:
      runOnce:
        deploy:
          steps:

          - task: AzureWebAppContainer@1
            displayName: 'Deploy Kanakku Web UI container to App Service'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appName: '$(webAppName)'
              containers: '$(ACR_LOGIN_SERVER)/$(ACR_REPOSITORY):$(imageTag)'
              appSettings: '-WEBSITES_PORT 80'
