worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 1024;

  upstream kanakku_api {
    server api:3001;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check served by nginx itself (does not touch upstream)
    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    # Proxy API
    location /api/ {
      proxy_pass http://kanakku_api;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      client_max_body_size 25m;
    }

    # Uploaded assets (served directly by api today; will move to S3-compatible later)
    location /uploads/ {
      proxy_pass http://kanakku_api;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
    }

    # Hashed build assets are content-addressed → safe to cache forever.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # index.html must never be cached, otherwise clients keep loading an old
    # bundle hash after a deploy and never pick up new frontend code.
    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      expires -1;
    }

    # SPA fallback — served HTML also gets no-cache (returns index.html).
    location / {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      expires -1;
      try_files $uri $uri/ /index.html;
    }
  }
}
