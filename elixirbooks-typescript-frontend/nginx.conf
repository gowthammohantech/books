worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;
    gzip_min_length 1024;

    upstream elixirbooks_api {
        server elixirbooks-kanaku-api-cagqg6fng5dtazbc.southeastasia-01.azurewebsites.net:443;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Health check served directly by NGINX.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Proxy API requests to the Azure App Service backend.
        # This preserves the /api/... path.
        location /api/ {
            proxy_pass https://elixirbooks_api;

            proxy_http_version 1.1;

            # Required for HTTPS/SNI when proxying to Azure App Service.
            proxy_ssl_server_name on;
            proxy_ssl_name elixirbooks-kanaku-api-cagqg6fng5dtazbc.southeastasia-01.azurewebsites.net;

            proxy_set_header Host elixirbooks-kanaku-api-cagqg6fng5dtazbc.southeastasia-01.azurewebsites.net;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            client_max_body_size 25m;
        }

        # Uploaded assets currently served by the API.
        location /uploads/ {
            proxy_pass https://elixirbooks_api;

            proxy_http_version 1.1;

            proxy_ssl_server_name on;
            proxy_ssl_name elixirbooks-kanaku-api-cagqg6fng5dtazbc.southeastasia-01.azurewebsites.net;

            proxy_set_header Host elixirbooks-kanaku-api-cagqg6fng5dtazbc.southeastasia-01.azurewebsites.net;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Vite hashed assets are content-addressed and safe to cache long-term.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Never cache index.html so users always receive the latest bundle references.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }

        # SPA fallback for React/Vite routing.
        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}