# Dev hot-reload override for the api container.
#
# NOT auto-applied by the Makefile (the Makefile passes -f explicitly).
# Apply explicitly with:
#   docker compose --env-file docker/.env \
#     -f docker/docker-compose.yml \
#     -f docker/docker-compose.override.yml up -d --build
#
# (Web hot-reload is deferred; for now `docker compose build web` after a
# frontend change.)

services:
  api:
    image: elixirbooks-api:dev
    build:
      # Root context, matching docker-compose.yml — the workspace lockfile has
      # to be inside the build context.
      context: ..
      dockerfile: apps/api/Dockerfile
      # dev-deps, not deps: nodemon is a devDependency, and `deps` installs
      # with --omit=dev.
      target: dev-deps
    working_dir: /repo/apps/api
    command: ["npx", "nodemon"]
    volumes:
      # Source is bind-mounted so edits are picked up. nodemon.json sets
      # ext=ts,js,json, so .ts edits actually trigger a restart.
      - ../apps/api:/repo/apps/api
      # Anonymous volumes shield the image's installed dependencies from the
      # bind mount above. node_modules is HOISTED to the workspace root, so the
      # root one is the important one; the app-local path is masked too in case
      # npm nested anything there.
      - /repo/node_modules
      - /repo/apps/api/node_modules
    environment:
      NODE_ENV: development
