# Dev hot-reload override for the api container.
#
# NOT auto-applied by the Makefile (the Makefile passes -f explicitly).
# Apply explicitly with:
#   docker compose --env-file docker/.env \
#     -f docker/docker-compose.yml \
#     -f docker/docker-compose.override.yml up -d --build
#
# (Web hot-reload is deferred to a later slice; for now you can `docker compose
# build web` to rebuild after frontend changes.)

services:
  api:
    image: elixirbooks-api:dev
    build:
      context: ../elixirbooks-typescript-backend
      dockerfile: Dockerfile
      target: deps
    command: ["npx", "nodemon", "server.js"]
    volumes:
      - ../elixirbooks-typescript-backend:/app
      - /app/node_modules
      - elixirbooks-uploads:/app/uploads
    environment:
      NODE_ENV: development
