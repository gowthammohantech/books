name: elixirbooks

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - elixirbooks-pg-data:/var/lib/postgresql/data
    networks:
      - elixirbooks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: elixirbooks-api:slice-0
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      # Entrypoint runs prisma migrate deploy + idempotent baseline seed on boot.
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # AES-256-GCM key (32-byte hex) for encrypting stored BYOK provider keys
      # (cluster H). If unset the app falls back to deriving a key from
      # JWT_SECRET (with a warning) — set this in production so encrypted keys
      # survive JWT_SECRET rotations. Generate with: openssl rand -hex 32
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
      # Per-user daily AI call quota (cluster H, slice H.4). Defaults to 200.
      AI_MAX_CALLS_PER_DAY: ${AI_MAX_CALLS_PER_DAY:-}
      WHATSAPPCRM_API_KEY: ${WHATSAPPCRM_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      - elixirbooks-uploads:/repo/apps/api/uploads
    networks:
      - elixirbooks
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: elixirbooks-web:slice-0
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - elixirbooks
    depends_on:
      - api

  # ===========================================================================
  # Opt-in services (use:  docker compose --profile redis up -d --build)
  # ===========================================================================

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - elixirbooks-redis-data:/data
    networks:
      - elixirbooks
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    profiles: ["redis"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: elixirbooks-api:slice-0
    restart: unless-stopped
    # In Slice 0 the worker container is a placeholder: it boots the same image
    # but only runs the in-process cron registration (no separate BullMQ
    # consumer yet -- that lands in Slice 1.7).
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3002
      JWT_SECRET: ${JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REDIS_URL: ${REDIS_URL}
    networks:
      - elixirbooks
    depends_on:
      redis:
        condition: service_healthy

volumes:
  elixirbooks-pg-data:
  elixirbooks-redis-data:
  elixirbooks-uploads:

networks:
  elixirbooks:
    driver: bridge
