name: elixirbooks

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - elixirbooks-pg-data:/var/lib/postgresql/data
    networks:
      - elixirbooks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: elixirbooks-api:slice-0
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      # Entrypoint runs prisma migrate deploy + idempotent baseline seed on boot.
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # AES-256-GCM key (32-byte hex) for encrypting stored BYOK provider keys
      # (cluster H). If unset the app falls back to deriving a key from
      # JWT_SECRET (with a warning) — set this in production so encrypted keys
      # survive JWT_SECRET rotations. Generate with: openssl rand -hex 32
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
      # Per-user daily AI call quota (cluster H, slice H.4). Defaults to 200.
      AI_MAX_CALLS_PER_DAY: ${AI_MAX_CALLS_PER_DAY:-}
      WHATSAPPCRM_API_KEY: ${WHATSAPPCRM_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      REDIS_URL: ${REDIS_URL:-}
      # Object storage for every upload in the product (logos, signatures,
      # receipts, AI source bills). Azurite locally; a real storage account in
      # Azure. Nothing is written to this container's filesystem.
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-uploads}
      AZURE_STORAGE_SAS_TTL_MINUTES: ${AZURE_STORAGE_SAS_TTL_MINUTES:-60}
      # The blob endpoint the BROWSER can reach, when it differs from the one
      # this container uses. Signed URLs are rewritten onto it before they go
      # out. Leave unset in Azure.
      AZURE_STORAGE_PUBLIC_ENDPOINT: ${AZURE_STORAGE_PUBLIC_ENDPOINT:-}
    networks:
      - elixirbooks
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started

  # Local stand-in for Azure Blob Storage. Not optional: every upload in the
  # product goes here, so the lean stack includes it.
  #
  # Port 10000 is PUBLISHED because the signed URLs the SPA receives point at
  # it directly -- the browser loads uploads from Azurite, not through the API.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    restart: unless-stopped
    # --skipApiVersionCheck: @azure/storage-blob sends a service API version
    # newer than the one Azurite pins to, and Azurite rejects it outright
    # ("The API version ... is not supported by Azurite") -- which fails every
    # upload the moment the SDK is bumped. Skipping the check is Microsoft's own
    # workaround and keeps the API code identical against Azurite and the real
    # service; the alternative is pinning a service version in application code
    # for the sake of the emulator.
    command:
      - "azurite-blob"
      - "--blobHost"
      - "0.0.0.0"
      - "--blobPort"
      - "10000"
      - "--location"
      - "/data"
      - "--skipApiVersionCheck"
    ports:
      - "${AZURITE_PORT:-10000}:10000"
    volumes:
      - elixirbooks-azurite-data:/data
    networks:
      - elixirbooks

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: elixirbooks-web:slice-0
    restart: unless-stopped
    environment:
      # Read at container start by docker-entrypoint.d/15-render-nginx-conf.sh.
      # Set => nginx proxies /api to the api service (same-origin SPA).
      # Unset => nginx serves the SPA only, which is what standalone deploys of
      # this image need. Uploads are NOT proxied: they are loaded straight from
      # blob storage using the signed URLs the API returns.
      API_ORIGIN: ${API_ORIGIN:-http://api:3001}
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - elixirbooks
    depends_on:
      - api

  # ===========================================================================
  # Opt-in services (use:  docker compose --profile redis up -d --build)
  # ===========================================================================

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - elixirbooks-redis-data:/data
    networks:
      - elixirbooks
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    profiles: ["redis"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: elixirbooks-api:slice-0
    restart: unless-stopped
    # In Slice 0 the worker container is a placeholder: it boots the same image
    # but only runs the in-process cron registration (no separate BullMQ
    # consumer yet -- that lands in Slice 1.7).
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3002
      JWT_SECRET: ${JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REDIS_URL: ${REDIS_URL}
    networks:
      - elixirbooks
    depends_on:
      redis:
        condition: service_healthy

volumes:
  elixirbooks-pg-data:
  elixirbooks-redis-data:
  elixirbooks-azurite-data:

networks:
  elixirbooks:
    driver: bridge
