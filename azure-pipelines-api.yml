name: $(Date:yyyyMMdd).$(Rev:r)

# The API image builds from the REPOSITORY ROOT (npm workspaces keep a single
# lockfile there), so the triggers cover the shared workspace files too — a
# change to packages/* or the root manifests changes the image.
trigger:
  branches:
    include:
      - dev
  paths:
    include:
      - apps/api/**
      - packages/**
      - scripts/**
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - turbo.json
      - .npmrc
      - .dockerignore
      - azure-pipelines-api.yml

pr:
  branches:
    include:
      - dev
  paths:
    include:
      - apps/api/**
      - packages/**
      - scripts/**
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - turbo.json
      - .npmrc
      - .dockerignore
      - azure-pipelines-api.yml

variables:
  azureServiceConnection: 'stg-books-smart-service-connection'
  acrServiceConnection: 'stg-books-acr-service-connection'
  ACR_LOGIN_SERVER: 'ebselixiracr.azurecr.io'
  ACR_REPOSITORY: 'elixirbooks-pro'
  apiWebAppName: 'elixirbooks-kanaku-api'
  invoicingImageTag: 'stage-pro-api-$(Build.BuildNumber)'

pool:
  vmImage: 'ubuntu-latest'

stages:

# ============================================================
# BUILD AND PUSH IMAGE TO ACR
# ============================================================
- stage: BuildAndPush
  displayName: Build and Push Docker Image

  jobs:
  - job: BuildPushImage
    displayName: Build and Push Kanakku API Image

    steps:
    - checkout: self

    - task: Docker@2
      displayName: 'Build and push Kanakku API image'
      inputs:
        command: buildAndPush
        containerRegistry: '$(acrServiceConnection)'
        repository: '$(ACR_REPOSITORY)'
        dockerfile: 'apps/api/Dockerfile'
        # Repo root: the Dockerfile copies the root lockfile and every workspace
        # manifest so `npm ci` is reproducible.
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(invoicingImageTag)


# ============================================================
# DEPLOY TO STAGING
# ============================================================
- stage: DeployToStaging
  displayName: Deploy to Staging

  dependsOn: BuildAndPush

  condition: succeeded()

  jobs:
  - deployment: Deploy_kanakku_api_staging
    displayName: Deploy Kanakku API to Staging

    environment: 'kanakku-api-staging'

    strategy:
      runOnce:
        deploy:
          steps:

          - task: AzureWebAppContainer@1
            displayName: 'Deploy Kanakku API container to App Service'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appName: '$(apiWebAppName)'
              containers: '$(ACR_LOGIN_SERVER)/$(ACR_REPOSITORY):$(invoicingImageTag)'
              appSettings: '-WEBSITES_PORT 3001'
